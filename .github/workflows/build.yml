name: Собрать и опубликовать каталог

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"     # раз в сутки: правки в самой таблице попадают на сайт сами

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Правки, сделанные на сайте (страница номера и /admin/), переносим в таблицу ДО сборки.
      # Только при ручном запуске — по кнопке «Обновить сайт»: администратор сам решает, когда
      # изменения увидят все. При push и ночной сборке шаг пропускается.
      - name: Применить правки со страниц сайта
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python tools/apply_edits.py
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      - name: Собрать сайт из таблицы
        run: python build.py
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
      # Аватары пользователей и пустые сводки оценок: страницы читают их из своих файлов
      # и из одного документа Firestore, а не запросами на каждого человека.
      - name: Подготовить аватары и сводки оценок
        continue-on-error: true
        run: python tools/export_public.py
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
