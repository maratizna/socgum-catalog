name: Собрать и опубликовать каталог

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут: страховка, если браузер не смог запустить сборку сразу
    - cron: "17 3 * * *"     # раз в сутки, чтобы правки в таблице попадали на сайт сами

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Правки со страницы /admin/ переносим в таблицу ДО сборки, иначе сайт соберётся из старой таблицы.
      # Если секрета нет, шаг тихо пропускается и сборка идёт как раньше.
      - name: Применить правки со страницы правки каталога
        continue-on-error: true
        run: python tools/apply_edits.py
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      - name: Собрать сайт из таблицы
        run: python build.py
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
